<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixIt - User Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="FixIt_Logo.png" alt="FixIt Logo">
        </div>

        <button class="sidebar-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <a href="userdb.html" class="nav-item active">
                Dashboard
            </a>

            <a href="reportdamage.html" class="nav-item">
                Report Damage
            </a>

            <a href="myreports.html" class="nav-item">
                My Reports
            </a>

            <a href="trackstatus.html" class="nav-item">
                Track Status
            </a>
        </nav>

        <div class="sidebar-spacer"></div>

        <a href="login.html" class="nav-item">
            Logout
        </a>

    </aside>

    <!-- Main -->
    <main class="main">

        <header class="topbar">

            <h1 class="topbar-title">
                <em>TRACK</em> STATUS
            </h1>

            <div class="topbar-actions">

                <button class="icon-btn">
                    🔔
                    <span class="notif-dot"></span>
                </button>

                <div class="avatar">
                    M
                </div>

            </div>

        </header>

        <section class="add-report-section">
            <a href="reportdamage.html" style="text-decoration: none;">
                <button class="add-report-btn">
                    <span style="font-size: 20px; font-weight: 300;">+</span>
                     ADD REPORT DAMAGE
                </button>
            </a>
        </section>

        <section class="stat-cards">
            <div class="stat-card blue">
                <div class="stat-info">
                    <span class="stat-label">My Reports</span>
                    <span class="stat-value">0</span>
                </div>
            </div>

            <div class="stat-card yellow">
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value">0</span>
                </div>
            </div>

            <div class="stat-card pink">
                <div class="stat-info">
                    <span class="stat-label">In Progress</span>
                    <span class="stat-value">0</span>
                </div>
            </div>

            <div class="stat-card green">
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value">0</span>
                </div>
            </div>
        </section>

        <section class="table-card">

            <div class="track-header">

                <h2>Report #001</h2>

                <span class="status-badge progress">
                    In Progress
                </span>

            </div>

            <br>

            <p><strong>Location:</strong> </p>
            <p><strong>Issue:</strong> </p>

            <br>

            <div class="timeline">

                <div class="timeline-item completed">
                    Report Submitted
                </div>

                <div class="timeline-item completed">
                    Under Review
                </div>

                <div class="timeline-item active-status">
                    In Progress
                </div>

                <div class="timeline-item">
                    Completed
                </div>

            </div>

            <br>

            <h3>Uploaded Photo</h3>

            <img src="damage.jpg"
                 alt="Damage Image"
                 class="track-image">

        </section>

    </main>

</body>
</html>>
