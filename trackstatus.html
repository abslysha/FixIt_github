<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - FixIt</title>
    <link rel="stylesheet" href="userstyles.css">

</head>
<body>
    <div class="container">

        <aside class="sidebar">
            <h2>USER DASHBOARD</h2>
            <ul>
                <Li><a href="userdb.html">Dashboard</a></Li>
                <Li><a href="userreport.html">Report Damage</a></Li>
                <Li><a href="myreports.html">My Reports</a></Li>
                <Li><a href="trackstatus.html">Track Status</a></Li>
                <Li><a href="logout.html">Logout</a></Li>
            </ul>
        </aside>

    <!-- Content -->
    <div class="content">

        <h2>TRACK STATUS</h2>

        <input type="text"
               placeholder="Enter Report ID">

        <div class="track-container">

            <!-- Timeline -->
            <div class="timeline">

                <h3>#0123</h3>
                <h4>Reported Issue</h4>
                <p>Aircond leak</p>

                <div class="step">
                    12 Apr 2025 - Report Submitted
                </div>

                <div class="step">
                    15 Apr 2025 - Under Review
                </div>

                <div class="step">
                    18 Apr 2025 - Technician Assigned
                </div>

                <div class="step">
                    20 Apr 2025 - Completed
                </div>

            </div>

            <!-- Photo -->
            <div class="photo">

                <h4>Photo Uploaded</h4>

                <img src="aircond.jpg" alt="Aircond">

                <button>
                    VIEW ALL REPORTS
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
