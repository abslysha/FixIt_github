<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixIt - User Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="FixIt_Logo.png" alt="FixIt Logo">

        </div>

        <button class="sidebar-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>

<a href="userdb.html" class="nav-item">
    Dashboard
</a>

<a href="myreport.html" class="nav-item active">
    My Report
</a>

            <a href="userdb.html" class="nav-item">
    Dashboard
</a>

<a href="myreport.html" class="nav-item active">
    My Report
</a>

            <a href="trackstatus.html" class="nav-item">
                Track Status
            </a>


        </nav>

        <div class="sidebar-spacer"></div>

        <a href="login.html" class="nav-item">
    Logout
</a>

    </aside>

    <!-- Main Content -->
    <main class="main">

        <header class="topbar">

            <h1 class="topbar-title">
                <em>MY</em> REPORT
            </h1>

            <div class="topbar-actions">

                <button class="icon-btn">
                    🔔
                    <span class="notif-dot"></span>
                </button>

                <div class="avatar">
                    M
                </div>

            </div>

        </header>

        <!-- Statistics -->
        <section class="stat-cards">

            <div class="stat-card blue">
                <div class="stat-info">
                    <span class="stat-label">My Reports</span>
                    <span class="stat-value">0</span>
                </div>
            </div>

            <div class="stat-card yellow">
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value">0</span>
                </div>
            </div>

            <div class="stat-card pink">
                <div class="stat-info">
                    <span class="stat-label">In Progress</span>
                    <span class="stat-value">0 </span>
                </div>
            </div>

            <div class="stat-card green">
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value">0</span>
                </div>
            </div>

        </section>

        <!-- Report Table -->
        <section class="table-card">

            <div class="table-controls">

                <div class="show-entries">
                    Show
                    <select>
                        <option>10</option>
                        <option>25</option>
                        <option>50</option>
                    </select>
                    entries
                </div>

                <div class="search-box">
                    <input type="text" placeholder="Search">
                </div>

            </div>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Issue</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        

                </tbody>

            </table>

            <div class="pagination">

                <button>&lt;</button>

                <button class="active-page">
                    1
                </button>

                <button>2</button>

                <button>3</button>

                <button>&gt;</button>

            </div>

        </section>

    </main>

</body>
</html>
