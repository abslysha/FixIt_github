<script>

const userSearch =
document.getElementById("userSearch");

userSearch.addEventListener("keyup", function(){

    let value =
    this.value.toLowerCase();

    document
    .querySelectorAll("#userTable tr")
    .forEach(row => {

        row.style.display =
        row.innerText
        .toLowerCase()
        .includes(value)
        ? ""
        : "none";

    });

});

</script>
